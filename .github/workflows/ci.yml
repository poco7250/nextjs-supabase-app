name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: 타입 체크
        run: npm run typecheck
      - name: 린트
        run: npm run lint -- --max-warnings=0
      - name: 포맷 검사
        run: npm run format:check
      - name: 테스트
        run: npm run test
